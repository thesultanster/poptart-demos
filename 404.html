<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // SPA redirect for GitHub Pages
      // Redirects to index.html preserving the path as a query param
      var repo = '/poptart-demos';
      var l = window.location;
      var path = l.pathname.slice(repo.length);
      l.replace(l.protocol + '//' + l.host + repo + '/?p=' + encodeURIComponent(path + l.search + l.hash));
    </script>
  </head>
  <body></body>
</html>
