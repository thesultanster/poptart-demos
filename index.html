<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hungryroot</title>
    <script type="module" crossorigin src="/poptart-demos/assets/index-C0wfzK3o.js"></script>
    <link rel="stylesheet" crossorigin href="/poptart-demos/assets/index-CqdXGr2z.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        var q = new URLSearchParams(window.location.search);
        var p = q.get('p');
        if (p) {
          q.delete('p');
          var remaining = q.toString();
          var restored = p + (remaining ? (p.includes('?') ? '&' : '?') + remaining : '');
          window.history.replaceState(null, '', '/poptart-demos' + restored);
        }
      })();
    </script>
  </body>
</html>
